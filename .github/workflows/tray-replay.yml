name: Explorer 托盘实测
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Windows 预览版标签，或 source（编译所选分支的演示界面）
        required: true
        default: windows-v0.1.0-alpha.46
      scale:
        description: 隔离桌面的缩放百分比（current 保留默认值）
        type: choice
        options: [current, '125', '150', '175', '200']
        default: current
permissions:
  contents: read
jobs:
  replay:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 获取公开发布包并核对 SHA-256
        if: inputs.tag != 'source'
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:TAG -notmatch '^windows-v[0-9.]+-alpha\.[0-9]+$') { throw '无效版本' }
          gh release download $env:TAG -p AgentMeter-Windows-x64.zip -p SHA256SUMS.txt -D $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw '下载失败' }
          $zip = Join-Path $env:RUNNER_TEMP 'AgentMeter-Windows-x64.zip'
          $expected = ((Get-Content "$env:RUNNER_TEMP/SHA256SUMS.txt" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $zip).Hash -ne $expected) { throw '校验失败' }
          Expand-Archive $zip "$env:RUNNER_TEMP/test-release"
      - uses: actions/setup-dotnet@v4
        if: inputs.tag == 'source'
        with:
          dotnet-version: '8.0.x'
      - name: 从当前提交构建演示界面
        if: inputs.tag == 'source'
        shell: pwsh
        run: dotnet publish windows/AgentMeter.Windows -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/test-release/AgentMeter"
      - name: 点击通知区域图标，核对开合与导航
        shell: powershell
        env:
          TEST_SCALE: ${{ inputs.scale }}
        run: |
          ./windows/qa/explorer-tray.ps1 -Executable "$env:RUNNER_TEMP/test-release/AgentMeter/AgentMeter.Windows.exe" -OutputDir "$env:RUNNER_TEMP/tray-replay" -Scale $env:TEST_SCALE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Explorer-tray-replay
          path: ${{ runner.temp }}/tray-replay
