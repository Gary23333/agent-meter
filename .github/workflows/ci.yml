name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install compressed-fixture support
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Run isolated offline regression tests
        run: python scripts/test-offline.py
      - name: Build and validate Python distributions
        run: |
          python -m pip install build
          python -m build
          python scripts/check-package-version.py
  pets:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Runtime logic tests
        run: node --test pets/runtime/test/*.test.mjs
      - name: Validate built-in pet packs
        run: python3 pets/tools/petpack.py validate pets/presets/* --strict
  swift:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: menubar
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test
      - run: swift build -c release
