name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install compressed-fixture support
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Run isolated offline regression tests
        run: python scripts/test-offline.py
      - name: Build and validate Python distributions
        run: |
          python -m pip install build
          python -m build
          python scripts/check-package-version.py
  swift:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: menubar
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test
      - run: swift build -c release
