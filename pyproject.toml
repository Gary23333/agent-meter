[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-meter-backend"
version = "0.2.0"
description = "Local read-only agent usage collectors and verification API"
requires-python = ">=3.9"
dependencies = []
license = {file = "LICENSE"}

[project.scripts]
agent-meter = "agent_meter.cli:main"

[tool.setuptools.packages.find]
include = ["agent_meter*"]

[tool.setuptools.package-data]
agent_meter = ["helpers/*.mjs"]
